<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemonade CORE: Immersive Games Built to Play Anywhere, Anytime.</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --main-bg: #000000;
            --accent-color: #b1aeac;
            --discord-color: #5865F2;
            --text-white: #ffffff;
            --box-bg: #1b1a1a;
            --box-hover: #262525;
            --font-family: 'Aldrich', sans-serif;
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-white);
            font-family: var(--font-family);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            z-index: 1000;
            transition: 0.3s;
        }

        nav.scrolled {
            background: rgba(0, 0, 0, 0.95);
            padding: 10px 50px;
            border-bottom: 1px solid var(--accent-color);
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-white);
            gap: 15px;
        }

        .logo img {
            height: 45px;
            transition: var(--transition);
        }

        .logo:hover img {
            transform: rotate(-10deg) scale(1.1);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-white);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        /* --- Discord Button Style --- */
        .btn-discord {
            background-color: var(--discord-color);
            color: white !important;
            padding: 10px 25px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-discord:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--discord-color);
            background-color: #4752c4;
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://files.cdn-files-a.com/uploads/11893592/2000_69bdafdec257c.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            padding: 0 10%;
        }

        .hero-content {
            max-width: 800px;
            background: rgba(177, 174, 172, 0.95);
            color: #000;
            padding: 60px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .hero-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: var(--discord-color);
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1;
        }

        .hero-content h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        /* --- Sections --- */
        .section {
            padding: 100px 10%;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 40px;
            border-left: 5px solid var(--accent-color);
            padding-left: 20px;
        }

        /* --- Team Grid (4 People) --- */
        .corporate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .member-card {
            background: var(--box-bg);
            padding: 40px 20px;
            border-radius: 8px;
            text-align: center;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .member-card:hover {
            transform: translateY(-15px);
            background: var(--box-hover);
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px rgba(177, 174, 172, 0.1);
        }

        .member-card img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
            border: 3px solid #333;
            transition: 0.3s;
        }

        .member-card:hover img {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* --- Projects --- */
        .project-slider {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--box-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
        }

        .project-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .project-img {
            height: 280px;
            background-size: cover;
            background-position: center;
        }

        .project-info {
            padding: 25px;
        }

        .project-tag {
            font-size: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stars {
            color: #ffbf00;
            margin-top: 10px;
        }

        /* --- Footer --- */
        footer {
            background: #080807;
            padding: 60px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1a1a1a;
        }

        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-links { display: none; }
            .hero-content h1 { font-size: 2.2rem; }
            footer { flex-direction: column; text-align: center; gap: 30px; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <a href="#" class="logo">
            <img src="https://files.cdn-files-a.com/uploads/11893592/400_filter_nobg_69bdafbda24ff.png" alt="Lemonade CORE">
            <span>Lemonade CORE</span>
        </a>


    </nav>

    <section id="home" class="hero">
        <div class="hero-content" data-aos="zoom-out-right">
            <h1>Lemonade CORE is moving.</h1>
            <h2>Our new site is currently underway. For now, you can email me at frankie@lemonade-co.site</h2>

        </div>
    </section>



    <footer>
        <div class="footer-logo">
            <p>Lemonade CORE</p>
            <p style="font-size: 0.7rem; font-weight: normal; opacity: 0.5; margin-top: 10px;">© 2026 Lemonade Co Productions. All rights reserved.</p>
        </div>

    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        window.onscroll = function() {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 100) { nav.classList.add('scrolled'); }
            else { nav.classList.remove('scrolled'); }
        };
    </script>
</body>
</html>
